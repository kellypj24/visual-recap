name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Weekly against the latest Claude Code, to catch changes to the mod API before users do.
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin test .
